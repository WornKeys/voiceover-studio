# Install once: `uv tool install pre-commit && pre-commit install`
repos:
  - repo: local
    hooks:
      - id: check-no-audio
        name: Keep voice recordings out of the repo
        entry: python scripts/check_no_audio.py
        language: system
        types: [file]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4 # keep in step with the ruff version in uv.lock
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
