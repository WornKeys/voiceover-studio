[project]
name = "voiceover-studio"
version = "0.1.0"
description = "Self-hosted AI voiceover studio: your own voice, your script, your AWS account."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "numpy>=2.0",
    "openai[bedrock]>=3.46",
    "pydantic>=2.9",
    "pyloudnorm>=0.1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bedrock = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voiceover_studio"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
