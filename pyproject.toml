[project]
name = "voiceover-studio"
version = "0.1.0"
description = "Self-hosted AI voiceover studio: your own voice, your script, your AWS account."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "gradio>=5",
    "numpy>=2.0",
    "openai[bedrock]>=3.46",
    "pydantic>=2.9",
    "pyloudnorm>=0.1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
bedrock = []
# Local models (the app image installs these; Linux + NVIDIA GPU). In the same lock file as the app, so the
# UI is tested with the gradio/huggingface-hub versions that qwen-tts allows.
gpu = [
    "audioseal>=0.2.1",
    "faster-whisper>=1.2.1",
    "qwen-tts==0.1.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voiceover_studio"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# User-facing copy: whole sentences are easier to read and edit than strings split to fit the line length.
"voiceover_studio/ui.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
