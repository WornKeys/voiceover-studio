name: security

# Security scans: our own code (CodeQL), our dependencies (OSV-Scanner on uv.lock) and our infrastructure files
# (Trivy: Terraform, Dockerfiles, Compose). Weekly too, because new vulnerabilities are published against code
# that hasn't changed. Findings go to the repository's Security tab; reviewed and accepted dependency findings
# are listed with their reasons in osv-scanner.toml and SECURITY.md.
#
# Third-party actions are pinned to full commit hashes (a tag can be moved; a commit can't). Dependabot keeps
# them up to date.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: code (CodeQL, ${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions] # "actions" checks the workflow files themselves
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

  dependencies:
    name: dependencies (OSV-Scanner)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Known vulnerabilities in uv.lock
        # Fails on any vulnerability not reviewed in osv-scanner.toml. The reviewed ones expire, so they get
        # looked at again.
        run: >
          docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2.7.0
          scan source --config=/src/osv-scanner.toml --lockfile=/src/uv.lock

  infrastructure:
    name: infrastructure (Trivy config)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Misconfigurations in Terraform, Dockerfiles and Compose
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.76.1
          config --quiet --severity MEDIUM,HIGH,CRITICAL --ignorefile /src/.trivyignore
          --format sarif --output /src/trivy.sarif /src
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-config
      - name: Fail on high or critical findings that aren't reviewed
        run: >
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.76.1
          config --quiet --severity HIGH,CRITICAL --ignorefile /src/.trivyignore --exit-code 1 /src
