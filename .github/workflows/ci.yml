name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the audio and secret scans check every commit

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: No audio files in history
        run: uv run python scripts/check_no_audio.py --history

      - name: No secrets in history
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git --redact --no-banner /repo

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform format and validate
        run: |
          tf() { docker run --rm -v "$PWD:/work" -w /work/infra/terraform hashicorp/terraform:1.16.7 "$@"; }
          tf fmt -check -recursive -diff
          tf init -backend=false -input=false
          tf validate

      - name: Shell scripts
        run: >
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 --external-sources
          scripts/*.sh scripts/lib/*.sh scripts/toolbox/*.sh infra/instance/*.sh

      - name: Compose file
        run: |
          sudo mkdir -p /opt/voiceover && sudo touch /opt/voiceover/app.env
          AWS_REGION=us-east-1 LLM_MODEL=test docker compose -f docker/compose.yaml --profile local-llm config --quiet

      - name: Toolbox image (pinned tool versions still download)
        run: docker build -t voiceover-toolbox:ci toolbox
